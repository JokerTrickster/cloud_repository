name: Deploy to AWS S3

# 트리거 설정
on:
  push:
    branches: [ main ]  # main 브랜치에 푸시할 때마다 실행
  workflow_dispatch:    # 수동 실행 버튼 활성화
  # pull_request:
  #   branches: [ main ]  # PR 시에도 실행하려면 주석 해제

# 환경 변수
env:
  AWS_REGION: ap-south-1
  S3_BUCKET: ${{ secrets.S3_BUCKET_NAME }}  # GitHub Secrets에 저장
  CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}  # 선택사항

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    # 권한 설정 (OIDC 사용 시 필요)
    permissions:
      contents: read
      id-token: write

    steps:
    # 1. 코드 체크아웃
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    # 2. Node.js 설정
    - name: 🔧 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    # 3. 의존성 설치
    - name: 📦 Install dependencies
      run: |
        npm ci
        echo "✅ Dependencies installed successfully"

    # 4. 환경 변수 설정 (.env.production 생성)
    - name: 🔐 Create production env file
      run: |
        cat > .env.production << EOF
        VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}
        VITE_AUTH_API_URL=${{ secrets.VITE_AUTH_API_URL }}
        VITE_GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID }}
        EOF
        echo "✅ Production environment file created"

    # 5. 빌드
    - name: 🏗️ Build application
      run: |
        npm run build
        echo "✅ Build completed"
        echo "📊 Build size:"
        du -sh dist

    # 6. 빌드 아티팩트 확인
    - name: 🔍 Check build artifacts
      run: |
        if [ ! -d "dist" ]; then
          echo "❌ Build directory not found!"
          exit 1
        fi
        echo "📁 Build artifacts:"
        ls -la dist/

    # 7. AWS 자격 증명 설정 (방법 1: Access Key 사용)
    - name: 🔑 Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    # 방법 2: OIDC 사용 (더 안전함) - 위의 방법 1 대신 사용
    # - name: 🔑 Configure AWS credentials (OIDC)
    #   uses: aws-actions/configure-aws-credentials@v4
    #   with:
    #     role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
    #     aws-region: ${{ env.AWS_REGION }}

    # 8. S3 버킷 존재 확인
    - name: 🪣 Check S3 bucket
      run: |
        if aws s3api head-bucket --bucket "$S3_BUCKET" 2>/dev/null; then
          echo "✅ S3 bucket exists: $S3_BUCKET"
        else
          echo "❌ S3 bucket not found: $S3_BUCKET"
          exit 1
        fi

    # 9. S3에 배포
    - name: 🚀 Deploy to S3
      run: |
        echo "📤 Uploading to S3..."

        # index.html 업로드 (캐시 없음)
        aws s3 cp dist/index.html s3://$S3_BUCKET/ \
          --cache-control "no-cache, no-store, must-revalidate" \
          --content-type "text/html" \
          --metadata-directive REPLACE

        # 정적 자산 업로드 (장기 캐시)
        if [ -d "dist/assets" ]; then
          aws s3 sync dist/assets s3://$S3_BUCKET/assets \
            --cache-control "public, max-age=31536000, immutable" \
            --delete
        fi

        # PWA 관련 파일
        if [ -f "dist/manifest.json" ]; then
          aws s3 cp dist/manifest.json s3://$S3_BUCKET/ \
            --cache-control "public, max-age=3600" \
            --content-type "application/manifest+json"
        fi

        # Service Worker
        for sw_file in dist/sw.js dist/service-worker.js dist/serviceWorker.js; do
          if [ -f "$sw_file" ]; then
            aws s3 cp $sw_file s3://$S3_BUCKET/ \
              --cache-control "no-cache, no-store, must-revalidate" \
              --content-type "application/javascript"
          fi
        done

        # 나머지 파일
        aws s3 sync dist s3://$S3_BUCKET \
          --exclude "index.html" \
          --exclude "assets/*" \
          --exclude "manifest.json" \
          --exclude "sw.js" \
          --exclude "service-worker.js" \
          --exclude "serviceWorker.js" \
          --cache-control "public, max-age=3600" \
          --delete

        echo "✅ S3 deployment completed"

    # 10. CloudFront 캐시 무효화 (선택사항)
    - name: 🔄 Invalidate CloudFront cache
      if: env.CLOUDFRONT_DISTRIBUTION_ID != ''
      run: |
        echo "🔄 Creating CloudFront invalidation..."
        INVALIDATION_ID=$(aws cloudfront create-invalidation \
          --distribution-id ${{ env.CLOUDFRONT_DISTRIBUTION_ID }} \
          --paths "/*" \
          --query 'Invalidation.Id' \
          --output text)
        echo "✅ CloudFront invalidation created: $INVALIDATION_ID"
      continue-on-error: true  # CloudFront 실패해도 배포는 성공으로 처리

    # 11. 배포 완료 알림
    - name: 📢 Deployment notification
      if: success()
      run: |
        echo "🎉 Deployment successful!"
        echo "🌐 Website URL: http://cloudbox-app.s3-website.ap-south-1.amazonaws.com"
        if [ ! -z "${{ env.CLOUDFRONT_DISTRIBUTION_ID }}" ]; then
          DOMAIN=$(aws cloudfront get-distribution \
            --id ${{ env.CLOUDFRONT_DISTRIBUTION_ID }} \
            --query 'Distribution.DomainName' \
            --output text 2>/dev/null || echo "")
          if [ ! -z "$DOMAIN" ]; then
            echo "☁️ CloudFront URL: https://$DOMAIN"
          fi
        fi

    # 12. 실패 시 디버깅 정보
    - name: 🐛 Debug on failure
      if: failure()
      run: |
        echo "❌ Deployment failed!"
        echo "📊 Current directory:"
        pwd
        echo "📁 Directory contents:"
        ls -la
        echo "🔍 Dist directory (if exists):"
        ls -la dist/ 2>/dev/null || echo "dist directory not found"